{% extends 'dashboard.html' %}
{% block title %}
	<title>index</title>
{% endblock %}

{% block body %}
    <div class="container one">
  <div class="slider">
        <div class="slider__row">
          <div class="slider__item active">
            <img
              src="{{ url_for('static',filename='media/first.jpeg') }}"
              alt="#"
            />
          </div>
          <div class="slider__item">
            <img
              src="{{ url_for('static',filename='media/second.jpeg') }}"
              alt="#"
            />
          </div>
          <div class="slider__item">
            <img
              src="{{ url_for('static',filename='media/third.jpeg') }}"
              alt="#"
            />
          </div>
          <div class="slider__item">
            <img src="{{ url_for('static',filename='media/fourth.jpeg') }}" alt="#" />
          </div>
          <div class="slider__item">
            <img src="{{ url_for('static',filename='media/fifth.jpeg') }}" alt="#" />
          </div>
          <div class="slider__item">
            <img
              src="{{ url_for('static',filename='media/sixth.png') }}"
              alt="#"
            />
          </div>
        </div>
        <div class="prev__btn">
          <img src="{{ url_for('static',filename='media/strelka__levo.svg') }}" alt="#" />
        </div>
        <div class="next__btn">
          <img src="{{ url_for('static',filename='media/strelka__right.svg') }}" alt="#" />
        </div>
      </div>
      <div class="slider__dots">
        <div class="dot__item active"></div>
        <div class="dot__item"></div>
        <div class="dot__item"></div>
        <div class="dot__item"></div>
        <div class="dot__item"></div>
        <div class="dot__item"></div>
      </div>
</div>

<div class="album py-5 bg-body-tertiary">
    <div class="container">

      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">

    {% for el in item %}
<div class="col">
          <div class="card shadow-sm">
            <svg class="bd-placeholder-img card-img-top" width="100%" height="225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: Thumbnail" preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title><rect width="100%" height="100%" fill="#55595c"></rect><text x="50%" y="50%" fill="#eceeef" dy=".3em">Thumbnail</text></svg>
            <div class="card-body">
              <p class="card-text">This is a wider card with supporting text below as a natural lead-in to additional content. This content is a little bit longer.</p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <button type="button" class="btn btn-sm btn-outline-secondary">{{ el.price }}</button>
                  <div class="btn-group">
                    <button type="button" class="btn btn-outline-secondary "><a class="text-decoration-none text-black" href="/index/{{ el.id }}">View</a></button>
                  </div>
                  <img src="{{ url_for('static', filename=item.image) }}">
                  <button type="button" class="btn btn-sm btn-outline-secondary">{{ el.title }}</button>
                </div>
                <small class="text-body-secondary">{{ el.id }}</small>
              </div>
            </div>
          </div>
        </div>
    {% endfor %}


      </div>
    </div>
</div>
{% endblock %}
