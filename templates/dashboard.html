<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/sign-in/">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static',filename='styles/main.css') }}">
    <title>Dashboard</title>

    {% block title %}{% endblock %}
</head>
<body>
<div>
<div class="px-3 py-2 text-bg-success border-bottom">
<header class="p-3 text-bg-success">
    <div class="container">
      <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
        <a href="/blog" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
            <img width="32" height="32" src="{{ url_for('static',filename='media/11.png') }}" alt="">
        </a>

        <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
          <li><a href="/index" class="nav-link px-2 text-white">Home</a></li>
          <li><a href="#" class="nav-link px-2 text-white">Features</a></li>
          <li><a href="#" class="nav-link px-2 text-white">Pricing</a></li>
          <li><a href="/contactus" class="nav-link px-2 text-white">Contact</a></li>
          <li><a href="/create" class="nav-link px-2 text-white">Create</a></li>
        </ul>

        <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search">
          <input type="search" class="form-control form-control-white text-bg-white" placeholder="Search..." aria-label="Search">
        </form>

        <div class="text-end">
          <p class="text-white me-2">Logged in as: {{ current_user.username }}</p>
          <button type="button" class="btn btn-outline-light me-2">Logout</button>
        </div>
      </div>
    </div>
  </header>
</div>
</div>

</html>
