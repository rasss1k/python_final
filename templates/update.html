{% extends 'fundument.html' %}


{% block title %}
CV Editor
{%endblock%}

{% block body %}
<div class = "container">
  <br>
  <h1> Editor</h1>    
    <br>
    <form method = "post" class="needs-validation" novalidate="">
        <div class="row g-3">
          <div class="col-sm-6">
            <label for="firstName" class="form-label">First name</label>
            <input type = "text" name = "name" id = "name" class = "form-control" placeholder="" value="{{article.name}}" required="">
            <div class="invalid-feedback">
              Valid first name is required.
            </div>
          </div>

          <div class="col-sm-6">
            <label for="lastName" class="form-label">Last name</label>
            <input type="text" name = "surname" id = "surname" class = "form-control" placeholder="" value="{{article.surname}}" required="">
            <div class="invalid-feedback">
              Valid last name is required.
            </div>
          </div>

          <div class="col-12">
            <label for="username" class="form-label">Username</label>
            <div class="input-group has-validation">
              <span class="input-group-text">@</span>
              <input type="text" name = "username" id = "username" class = "form-control" value="{{article.username}}" placeholder="Username" required="">
            <div class="invalid-feedback">
                Your username is required.
              </div>
            </div>
          </div>

          <div class="col-12">
            <label for="username" class="form-label">Work</label>
            <div class="input-group has-validation">
              <input type="text" name = "work" id = "work" class = "form-control" value="{{article.work}}" placeholder="Write your work here" required="">            
            </div>
          </div>

        <button class="w-100 btn btn-primary btn-lg" type="submit">Update</button>
      </form>
</div>
{%endblock%}
