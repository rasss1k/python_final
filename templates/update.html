{% extends 'dashboard.html' %}


{% block title %}
CV Editor
{%endblock%}

{% block body %}
<div class = "container">
  <br>
  <h1> Editor</h1>    
    <br>
    <form method = "post" class="needs-validation" novalidate="">
        <div class="row g-3">
          <div class="col-sm-6">
            <label for="firstName" class="form-label">First name</label>
            <input type = "text" name = "title" id = "title" class = "form-control" placeholder="" value="{{item.title}}" required="">
            <div class="invalid-feedback">
              Valid first name is required.
            </div>
          </div>

          <div class="col-sm-6">
            <label for="lastName" class="form-label">Last name</label>
            <input type="number" name = "price" id = "price" class = "form-control" placeholder="" value="{{item.price}}" required="">
            <div class="invalid-feedback">
              Valid last name is required.
            </div>
          </div>

        <button class="w-100 btn btn-primary btn-lg" type="submit">Update</button>
      </form>
</div>
{%endblock%}
